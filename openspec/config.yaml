schema: spec-driven

context: |
  Проект ocr-local: локальное распознавание одного изображения через CLI и веб.
  Единственный вход: openspec/context/00-start-here.md; обязательные документы читаются по его маршруту.
  Требования проекта: openspec/specs; текущая работа: openspec/changes/README.md.
  Контракты приложения: image-ocr и local-web. Среда, сохранность данных и приёмка OCR: engineering-governance.
  Детали среды: engineering-governance/reference/project-specific.md.
  Проектные инструкции агента: AGENTS.md. Общий маршрут: instructions/README.md в каталоге глобальных инструкций.

rules:
  proposal:
    - Укажи потребность, границы и затронутые возможности; гипотезы не превращаются в принятый объём автоматически.
  specs:
    - 'У каждого требования один основной источник; сохраняй условия, наблюдаемый результат и сценарии WHEN/THEN.'
  design:
    - Опиши границы компонентов и причины решения; свяжи с требованиями и ADR.
    - Точку продолжения веди по разделу «Продолжение задачи» в AGENTS.md.
  tasks:
    - Укажи применимые проверки, их фактический охват и статус; сохраняй согласованный объём.
