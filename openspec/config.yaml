schema: spec-driven

context: |
  Продукт: локальный OCR одного изображения через GLM-OCR/PaddleOCR-VL-1.6, CLI и FastAPI.
  Стек: Python >=3.14; requirements.txt с точными версиями; метаданные pyproject.toml.
  Первый файл: openspec/context/00-start-here.md; остальные документы по маршруту.
  Нормы только в OpenSpec; код имеет приоритет при подтверждённом конфликте описания.
  Обязательны python-common.md и project-specific.md в engineering-governance/reference.
  Профильный кеш учитывает модель/prompt/лимиты; атомарная запись и Host/Origin-защита не реализованы.
  Документальный PASS не доказывает OCR; известные ограничения не принятая очередь.
  Всегда применяй SEC-CONTEXT-001…004, ENG-006 и CTX-005…008: автоматическую сводку, выбор контекста и дисциплину окна.
  CTX-009 задаёт opt-in методику; этот проект не включается в ежедневный аудит без отдельного явного запроса.

rules:
  proposal:
    - Укажи потребность, Scope, Non-goals и точные capability; сохраняй согласованный объём задачи.
  specs:
    - Сохраняй Requirement, MUST/SHALL, Scenario и WHEN/THEN; формы EARS уточняют смысл.
    - Значимые параметры и примеры должны быть явны; код важнее устаревшего описания.
  design:
    - Свяжи сценарий с рабочим компонентом, проверкой и доказательством; используй профильные ADR.
    - Сохрани точку продолжения, факты, гипотезы и принятые решения раздельно.
  tasks:
    - Различай документальные проверки и реальные тесты, модели, GPU, сеть и выпуск.
    - Не создавай принятую работу из обнаруженного ограничения без явного решения.
    - Автоматически сохраняй точку продолжения по CTX-006; задачи остаются в tasks, метрики аудита не подменяют runtime-доказательства.
