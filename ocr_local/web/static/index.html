<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Local</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="image-pane">
      <input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,image/*" aria-label="Файл изображения" hidden disabled>
      <button id="dropZone" class="drop-zone" type="button" aria-label="Выбрать изображение" disabled>
        <span id="emptyState" class="empty-state">
          <span class="upload-icon">+</span>
          <span class="upload-title">Перетащите изображение</span>
          <span class="upload-hint">или нажмите для выбора файла<br>Ctrl+V — вставить изображение<br>Файл размером до 25 МиБ</span>
        </span>
        <img id="imagePreview" class="image-preview" alt="Загруженное изображение" hidden>
      </button>
    </section>
    <section class="text-pane">
      <header class="toolbar">
        <div>
          <div class="title">OCR Local</div>
          <div id="statusText" class="status">Изображение не выбрано</div>
        </div>
        <button id="recognizeBtn" class="primary-button" type="button" disabled>Распознать</button>
      </header>
      <form id="modelSettings" class="model-settings">
        <label class="wide-field">Модель
          <select id="modelSelect" aria-label="Модель"><option>Загрузка списка...</option></select>
        </label>
        <label class="wide-field">Промпт
          <input id="promptInput" type="text" required aria-label="Промпт" aria-describedby="promptLimitHint">
          <span id="promptLimitHint" class="status">До 8 КиБ текста в кодировке UTF-8.</span>
        </label>
        <label>Максимум новых токенов
          <input id="maxTokensInput" type="number" min="1" max="32768" required>
        </label>
        <label>Максимум пикселей
          <input id="maxPixelsInput" type="number" min="12544" max="16777216" step="1" required>
        </label>
        <label class="check-field"><input id="quantizationInput" type="checkbox"> INT8 — экономия памяти</label>
        <label class="check-field"><input id="forceInput" type="checkbox"> Распознать заново</label>
        <div class="settings-footer wide-field">
          <span id="modelHint" class="status"></span>
          <button id="resetSettingsBtn" class="ghost-button" type="button">Сбросить параметры</button>
        </div>
      </form>
      <div id="recoveryHint" class="metrics">После завершения результат доступен для восстановления связи в течение 30 минут.
        Уже показанный текст и сохранённые файлы остаются. После перезапуска приложения обновите страницу.</div>
      <div id="metricsText" class="metrics" aria-live="polite"></div>
      <textarea id="resultText" class="result-text" spellcheck="false" aria-label="Результат распознавания"></textarea>
      <section class="log-panel">
        <div class="log-header">
          <span>Логи</span>
          <button id="clearLogsBtn" class="ghost-button" type="button">Очистить</button>
        </div>
        <pre id="logConsole" class="log-console"></pre>
      </section>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
